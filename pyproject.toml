[project]
name = "btc-sim-whitelightning"
version = "0.1.0"
description = "Liquidity based bitcoin price discovery"
authors = [
    {name = "Peter Mancini",email = "Nectarineimp@users.noreply.github.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.5.4,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "fredapi (>=0.5.2,<0.6.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
